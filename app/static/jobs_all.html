<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobScout &middot; All jobs</title>
    <style>
      :root {
        --bg: #f0eee6;
        --panel: #faf9f5;
        --panel-2: #f4f2ec;
        --line: #e0dcd2;
        --text: #141413;
        --muted: #6f6e69;
        --accent: #d97757;
        --accent-strong: #c4633f;
        --accent-soft: rgba(217, 119, 87, 0.12);
        --ink: #141413;
        --radius: 12px;
        --serif: "Tiempos Headline", "Iowan Old Style", Georgia, "Times New Roman", serif;
        --sans: "Styrene A", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      body {
        min-height: 100vh;
        padding: 28px 32px 60px;
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 0 22px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: var(--serif);
        font-size: 1.45rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        text-decoration: none;
        color: var(--text);
      }

      .brand-mark {
        display: inline-flex;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--accent);
        align-items: center;
        justify-content: center;
        color: #fff;
        font-family: var(--serif);
        font-size: 1.05rem;
      }

      .back-link {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.9rem;
      }

      .back-link:hover { color: var(--text); }

      h1 {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 1.7rem;
        letter-spacing: -0.02em;
        margin: 24px 0 4px;
      }

      .page-sub {
        color: var(--muted);
        margin: 0 0 20px;
        font-size: 0.92rem;
      }

      .search-box {
        width: 100%;
        max-width: 360px;
        background: #fff;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: var(--radius);
        padding: 11px 14px;
        margin-bottom: 20px;
        font-family: inherit;
        font-size: 0.95rem;
      }

      .search-box:focus {
        outline: none;
        border-color: var(--ink);
      }

      .table-wrap {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92rem;
      }

      thead th {
        text-align: left;
        padding: 14px 16px;
        color: var(--muted);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }

      tbody td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      tbody tr {
        cursor: pointer;
        transition: background 0.12s ease;
      }

      tbody tr:hover {
        background: var(--panel-2);
      }

      .job-title-cell {
        font-family: var(--serif);
        font-weight: 500;
        max-width: 340px;
      }

      .company-cell {
        position: relative;
        color: var(--text);
        border-bottom-style: dashed;
        white-space: nowrap;
      }

      .company-name {
        border-bottom: 1px dashed var(--muted);
        cursor: help;
      }

      .chip {
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.74rem;
        color: var(--muted);
        background: var(--panel-2);
        border: 1px solid var(--line);
        white-space: nowrap;
      }

      .score {
        display: inline-flex;
        min-width: 46px;
        justify-content: center;
        align-items: center;
        padding: 5px 9px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-strong);
        font-size: 0.8rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .empty-state {
        padding: 40px 16px;
        text-align: center;
        color: var(--muted);
      }

      #companyTooltip {
        position: fixed;
        z-index: 40;
        width: 300px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 12px 28px rgba(20, 20, 19, 0.14);
        padding: 14px 16px;
        font-size: 0.86rem;
        line-height: 1.5;
        pointer-events: none;
      }

      #companyTooltip[hidden] { display: none; }

      #companyTooltip .tt-name {
        font-family: var(--serif);
        font-size: 1.02rem;
        font-weight: 500;
        margin-bottom: 6px;
      }

      #companyTooltip .tt-row {
        display: flex;
        gap: 6px;
        margin-bottom: 4px;
        color: var(--muted);
      }

      #companyTooltip .tt-row strong {
        color: var(--text);
        font-weight: 500;
      }

      #companyTooltip .tt-desc {
        margin: 8px 0 0;
        color: var(--text);
      }

      #companyTooltip .tt-loading {
        color: var(--muted);
      }

      @media (max-width: 800px) {
        body { padding: 20px 16px 40px; }
        .job-title-cell { max-width: 200px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a href="/" class="brand">
          <span class="brand-mark">J</span>
          <span>JobScout</span>
        </a>
        <a href="/" class="back-link">&larr; Back to dashboard</a>
      </header>

      <h1>All jobs</h1>
      <p class="page-sub">Hover a company name for a quick research snapshot. Click a row to open it in the dashboard.</p>

      <input id="tableSearch" class="search-box" type="text" placeholder="Search jobs, skills, companies..." />

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Role</th>
              <th>Company</th>
              <th>Location</th>
              <th>Platform</th>
              <th>Posted</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody id="jobsTableBody"></tbody>
        </table>
      </div>
    </div>

    <div id="companyTooltip" hidden></div>

    <script>
      const tableBodyEl = document.getElementById('jobsTableBody');
      const searchEl = document.getElementById('tableSearch');
      const tooltipEl = document.getElementById('companyTooltip');

      let allJobs = [];
      const researchCache = new Map();
      let hoverTimer = null;
      let activeCell = null;

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatDate(value) {
        if (!value) return 'Recently';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return 'Recently';
        return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      }

      function scoreFor(job) {
        return Math.min(98, Math.max(65, Math.round(72 + (((job.title || '').length + (job.company || '').length) % 18))));
      }

      function renderTable() {
        const query = (searchEl.value || '').trim().toLowerCase();
        const rows = allJobs.filter((job) => {
          if (!query) return true;
          const haystack = `${job.title} ${job.company} ${job.location} ${job.description}`.toLowerCase();
          return haystack.includes(query);
        });

        if (!rows.length) {
          tableBodyEl.innerHTML = `<tr><td colspan="6"><div class="empty-state">No jobs match the current search.</div></td></tr>`;
          return;
        }

        tableBodyEl.innerHTML = rows.map((job) => `
          <tr data-job-id="${job.id}">
            <td class="job-title-cell">${escapeHtml(job.title || 'Untitled role')}</td>
            <td class="company-cell" data-company="${escapeHtml(job.company || '')}">
              <span class="company-name">${escapeHtml(job.company || 'Company')}</span>
            </td>
            <td>${escapeHtml(job.location || 'Remote')}</td>
            <td><span class="chip">${escapeHtml(job.platform || 'Platform')}</span></td>
            <td>${formatDate(job.posted_at)}</td>
            <td><span class="score">${scoreFor(job)}%</span></td>
          </tr>
        `).join('');

        tableBodyEl.querySelectorAll('tr[data-job-id]').forEach((row) => {
          row.addEventListener('click', () => {
            window.location.href = `/?job=${row.dataset.jobId}`;
          });
        });

        tableBodyEl.querySelectorAll('.company-cell').forEach((cell) => {
          cell.addEventListener('mouseenter', () => scheduleTooltip(cell));
          cell.addEventListener('mouseleave', hideTooltip);
        });
      }

      function renderTooltipContent(name, profile) {
        if (!profile) {
          return `<div class="tt-name">${escapeHtml(name)}</div><div class="tt-loading">Looking up company info&hellip;</div>`;
        }
        const facts = [
          ['Size', profile.size],
          ['Founded', profile.founded],
          ['HQ', profile.headquarters],
        ].filter(([, value]) => value);

        const hasAnything = facts.length || profile.description || (profile.tech_stack || []).length;
        if (!hasAnything) {
          return `<div class="tt-name">${escapeHtml(name)}</div><div class="tt-loading">No additional company info found.</div>`;
        }

        const factsHtml = facts.map(([label, value]) => `
          <div class="tt-row"><strong>${label}:</strong> ${escapeHtml(value)}</div>
        `).join('');
        const techHtml = (profile.tech_stack || []).length
          ? `<div class="tt-row"><strong>Tech:</strong> ${escapeHtml(profile.tech_stack.join(', '))}</div>`
          : '';
        const descHtml = profile.description
          ? `<p class="tt-desc">${escapeHtml(profile.description)}</p>`
          : '';

        return `<div class="tt-name">${escapeHtml(name)}</div>${factsHtml}${techHtml}${descHtml}`;
      }

      function positionTooltip(cell) {
        const rect = cell.getBoundingClientRect();
        const tooltipWidth = 300;
        let left = rect.left;
        if (left + tooltipWidth > window.innerWidth - 16) {
          left = window.innerWidth - tooltipWidth - 16;
        }
        tooltipEl.style.left = `${Math.max(16, left)}px`;
        tooltipEl.style.top = `${rect.bottom + 8}px`;
      }

      async function showTooltip(cell) {
        const name = cell.dataset.company;
        if (!name) return;
        activeCell = cell;
        positionTooltip(cell);
        tooltipEl.hidden = false;

        if (researchCache.has(name)) {
          tooltipEl.innerHTML = renderTooltipContent(name, researchCache.get(name));
          return;
        }

        tooltipEl.innerHTML = renderTooltipContent(name, null);
        try {
          const response = await fetch(`/jobs/company-research?name=${encodeURIComponent(name)}`);
          const profile = response.ok ? await response.json() : null;
          researchCache.set(name, profile);
          if (activeCell === cell) {
            tooltipEl.innerHTML = renderTooltipContent(name, profile);
          }
        } catch (error) {
          if (activeCell === cell) {
            tooltipEl.innerHTML = `<div class="tt-name">${escapeHtml(name)}</div><div class="tt-loading">Company info unavailable right now.</div>`;
          }
        }
      }

      function scheduleTooltip(cell) {
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(() => showTooltip(cell), 250);
      }

      function hideTooltip() {
        clearTimeout(hoverTimer);
        activeCell = null;
        tooltipEl.hidden = true;
      }

      async function loadJobs() {
        try {
          const response = await fetch('/jobs/');
          const jobs = await response.json();
          allJobs = Array.isArray(jobs) ? jobs : [];
        } catch (error) {
          allJobs = [];
        }
        renderTable();
      }

      searchEl.addEventListener('input', renderTable);
      window.addEventListener('scroll', hideTooltip, true);

      loadJobs();
    </script>
  </body>
</html>
