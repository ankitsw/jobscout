services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: jobsc-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobscout:jobscout@db:5432/jobscout
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: jobsc-api-db
    environment:
      POSTGRES_USER: jobscout
      POSTGRES_PASSWORD: jobscout
      POSTGRES_DB: jobscout
    ports:
      - "5433:5432"
    volumes:
      - jobscout_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscout -d jobscout"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  jobscout_pgdata:
